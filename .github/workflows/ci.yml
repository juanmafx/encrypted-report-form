name: CI

on:
  push:
    branches: [master, modernize/2026]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, sodium, dom, xml, xmlwriter
          coverage: none
          tools: none
      - run: composer validate --no-check-publish
      - run: composer install --no-scripts --no-plugins --no-interaction --no-progress --prefer-dist
      - run: composer audit --no-interaction
      - run: vendor/bin/phpstan analyse --no-progress
      - run: vendor/bin/phpunit
